name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    name: Build, Test, & Report Coverage
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js Environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
          cache: 'npm' 

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install
        
      # 4. Run Jest Tests with Coverage
      - name: Run Jest Tests with Coverage
        run: npm test -- --coverage --coverageReporters=lcov

      # 4.5. ADD THIS CHECK (Suggested by AI)
      - name: Check coverage file exists
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "🚨 Coverage file not found! Jest failed to generate it."
            exit 1
          fi
          
      # 5. Send coverage to Coveralls
      - name: Send coverage to Coveralls
        uses: coverallsapp/github-action@v2
